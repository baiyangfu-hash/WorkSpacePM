project_id: "DJ-2026-005"
project_name: "边框缓存机 PLC 控制系统"
plc_program_root: "02_PLC程序/PLC_ST"
# 2026-11-17 CHG-PLC-2026-026：按模板目录整理后重列全部块（名字、路径与源码一致）
blocks:
  - name: "DJ005_Main"
    type: "OB"
    path: "02_PLC程序/PLC_ST/00_主程序/OB123.scl"
    responsibility: "主程序：按 DSN 3.2 顺序经背景 DB 调用 9 个功能块，不含逻辑（导入后在 TIA 里改号成 OB123）"
  - name: "GlobalVars_DJ005"
    type: "DB"
    path: "02_PLC程序/PLC_ST/00_全局数据/GlobalVars.db"
    responsibility: "全局变量与 IO 映射（不含 FB 实例）"
  - name: "FB_1001_MachineMode_BufferFraming_DJ005"
    type: "FB"
    path: "02_PLC程序/PLC_ST/03_模式与调度/FB_1001_MachineMode_BufferFraming_DJ005.scl"
    responsibility: "模式管理：手动/自动/暂停/停止、状态字"
  - name: "FB_1002_SingleLayerConveyor_BufferFraming"
    type: "FB"
    path: "02_PLC程序/PLC_ST/02_工位_动作机构/FB_1002_SingleLayerConveyor_BufferFraming.scl"
    responsibility: "单层输送机控制（FB_1007 内 4 个多重实例）"
  - name: "FB_1003_PickPlace_BufferFraming"
    type: "FB"
    path: "02_PLC程序/PLC_ST/02_工位_动作机构/FB_1003_PickPlace_BufferFraming.scl"
    responsibility: "取放料控制（Z+X1+夹爪协同步序）"
  - name: "FB_1004_GlueMachineFeeder_BufferFraming"
    type: "FB"
    path: "02_PLC程序/PLC_ST/02_工位_动作机构/FB_1004_GlueMachineFeeder_BufferFraming.scl"
    responsibility: "打胶机送料控制（X2 轴+打胶机交互 4 步状态机）"
  - name: "FB_1005_HomePrepare_BufferFraming"
    type: "FB"
    path: "02_PLC程序/PLC_ST/03_模式与调度/FB_1005_HomePrepare_BufferFraming.scl"
    responsibility: "回原点与准备序列"
  - name: "FB_1006_ManualTeach_BufferFraming"
    type: "FB"
    path: "02_PLC程序/PLC_ST/03_模式与调度/FB_1006_ManualTeach_BufferFraming.scl"
    responsibility: "手动与示教"
  - name: "FB_1007_ConveyorSystem_BufferFraming"
    type: "FB"
    path: "02_PLC程序/PLC_ST/02_工位_动作机构/FB_1007_ConveyorSystem_BufferFraming.scl"
    responsibility: "4 层输送系统（展开 4 个 FB_1002 并汇总）"
  - name: "FB_2001_CommonAlarm_AllStation_DJ005"
    type: "FB"
    path: "02_PLC程序/PLC_ST/05_公共报警/FB_2001_CommonAlarm_AllStation_DJ005.scl"
