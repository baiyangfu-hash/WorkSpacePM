# CST-FILE-002: 文件编码完整性（BOM 检测）
# 
# 检测并防止 UTF-8 BOM 累积。正常 UTF-8 文件不应有 BOM，
# 多余的 BOM 会导致 Edit/Write 工具哈希校验失败。
#
# 真实案例（2026-07-20）：PM_SESSION_SW-2026-008.md 累积 146 个 BOM，
# 导致所有 Edit/Write 操作全部失败。

id: "CST-FILE-002"
name: "文件编码完整性"
description: >
  检测并防止 UTF-8 BOM 累积。正常 UTF-8 文件不应有 BOM，
  多余的 BOM 会导致 Edit/Write 工具哈希校验失败。
type: file_encoding
severity: error
scope:
  patterns:
    - "**/*.md"
    - ".trae/**/*.md"
    - "**/*.py"
    - "**/*.qml"
    - "**/*.yaml"
    - "**/*.json"
  exclude:
    - "**/__pycache__/**"
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/coverage/**"
    - ".trae/specs/**"
rules:
  - type: "bom_count"
    max_count: 1
    description: "UTF-8 文件不应包含 BOM，最多允许 1 个"
  - type: "null_byte"
    description: "文本文件不应包含 NUL 字节"
auto_fix: true
heal_command: "strip_bom"