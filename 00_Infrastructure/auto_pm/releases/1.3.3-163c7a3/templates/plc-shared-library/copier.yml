# Copier 模板配置 - PLC 公共库（LSP-907）
# 用于生成符合 LSP-907 规范的 PLC 公共库项目骨架

library_name:
  type: str
  help: 库名称（如 SysLib、CommLib）
  validator: >-
    {% if not (library_name | regex_search('^[A-Z][a-zA-Z0-9]*$')) %}
    library_name 必须以大写字母开头，仅含字母数字（如 SysLib）
    {% endif %}

description:
  type: str
  help: 库描述
  default: "PLC 公共函数库"

version:
  type: str
  help: 库初始版本
  default: "V1.0.0"

# V0.2.1-P1-3: 记录技术栈元数据（非交互，由 CLI 传入）
stack:
  type: str
  default: "plc"
  when: false

mode:
  type: str
  default: "shared-library"
  when: false

business_line:
  type: str
  default: ""
  when: false

# 模板内容在 template/ 子目录
_subdirectory: template

# 排除以下文件不渲染
_exclude:
  - "copier.yml"
  - "README.md"

# 生成 .copier-answers.yml 记录答案（支持后续 copier update）
_answers_file: .copier-answers.yml
