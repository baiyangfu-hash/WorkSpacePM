# Copier 模板配置 - PLC 公共库验证项目（LSP-907）
# 用于生成扁平结构的 PLC 测试项目，验证公共库功能

project_id:
  type: str
  help: 项目编号（如 DJ-2026-000）
  validator: >-
    {% if not (project_id | regex_search('^[A-Z]+-\\d{4}-\\d{3}$')) %}
    project_id 必须匹配格式: 字母-年份-序号（如 DJ-2026-000）
    {% endif %}

project_name:
  type: str
  help: 项目名称（如 SysLib验证）

description:
  type: str
  help: 项目描述
  default: "{{ project_name }}"

version:
  type: str
  help: 项目初始版本
  default: "V1.0.0"

# V0.2.1-P1-3: 记录技术栈元数据（非交互，由 CLI 传入）
stack:
  type: str
  default: "plc"
  when: false

mode:
  type: str
  default: "test-suite"
  when: false

business_line:
  type: str
  default: ""
  when: false

# 模板内容在 template/ 子目录
_subdirectory: template

# 排除以下文件不渲染
_exclude:
  - "copier.yml"
  - "README.md"

# 生成 .copier-answers.yml 记录答案
_answers_file: .copier-answers.yml
