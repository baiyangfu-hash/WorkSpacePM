# Ruff 配置 - 对齐 210 Python 编程规范
# https://docs.astral.sh/ruff/configuration/

line-length = 100
target-version = "py311"
extend-exclude = [
    "coverage",
    "dist",
    "build",
]

[lint]
# 规则集说明：
# E/W  - pycodestyle 错误/警告
# F    - pyflakes（未使用变量/导入等）
# I    - isort 导入排序
# N    - pep8-naming 命名规范
# UP   - pyupgrade 现代语法
# B    - flake8-bugbear 常见陷阱
# C4   - flake8-comprehensions 推导式优化
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501",  # 行长由 line-length 控制，ruff format 处理
]

[lint.per-file-ignores]
"tests/*" = [
    "S101",  # 测试允许 assert
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
