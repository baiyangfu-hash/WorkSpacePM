# Copier 模板配置 - Python 工具项目（210 规范）
# 用于生成符合 210 编程规范的 Python CLI 工具项目骨架

project_id:
  type: str
  help: 项目编号（如 SW-2026-009）
  validator: >-
    {% if not (project_id | regex_search('^[A-Z]+-\\d{4}-\\d{3}$')) %}
    project_id 必须匹配格式: 字母-年份-序号（如 SW-2026-009）
    {% endif %}

project_name:
  type: str
  help: 项目名称（如 数据分析工具）

package_name:
  type: str
  help: Python 包名（小写+下划线，如 data_tool）
  default: "{{ project_name | replace(' ', '_') | lower }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    package_name 必须以字母开头，仅含小写字母/数字/下划线
    {% endif %}

cli_command:
  type: str
  help: CLI 命令名（如 data-tool）
  default: "{{ package_name | replace('_', '-') }}"

description:
  type: str
  help: 项目描述
  default: "{{ project_name }}"

author:
  type: str
  help: 作者名
  default: "fubai"

version:
  type: str
  help: 项目初始版本
  default: "0.1.0"

# V0.2.1-P1-3: 记录技术栈元数据（非交互，由 CLI 传入）
stack:
  type: str
  default: "python"
  when: false

mode:
  type: str
  default: ""
  when: false

business_line:
  type: str
  default: ""
  when: false

# 模板内容在 template/ 子目录
_subdirectory: template

# 排除以下文件不渲染
_exclude:
  - "copier.yml"
  - "README.md"

# 生成 .copier-answers.yml 记录答案（支持后续 copier update）
_answers_file: .copier-answers.yml
