[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cockpit_probe_fake"
version = "V1.0.0"
description = "cockpit-probe 一次性假项目，只用于命令探测"
authors = [
    { name = "fubai" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "click>=8.1",
    "rich>=14",
    "pyyaml>=6.0",
]

[project.urls]
homepage = "https://github.com/fubai/cockpit_probe_fake"
source = "https://github.com/fubai/cockpit_probe_fake"

[project.scripts]
cockpit-probe-fake = "cockpit_probe_fake.cli.__main__:cli"

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "pre-commit>=3,<4",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["cockpit_probe_fake"]

[tool.mypy]
strict = true
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "cockpit_probe_fake",
]
testpaths = ["tests"]
addopts = [
    "--cov=cockpit_probe_fake/",
    "--cov-report=term",
    "--cov-report=html:coverage/html",
    "--color=yes",
]

[tool.coverage.run]
omit = [
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]
