[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-pm"
version = "1.3.0"
description = "自动化项目管理工具 - 统一CLI管理PLC/Python多技术栈项目"
authors = [
    { name = "fubai", email = "gotofritz@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10.6",
  "pydantic-settings>=2.6.1",
  "click>=8.1.7",
  "rich>=14",
  "pyyaml>=6.0",
  "copier>=9.7.1,<10",
  "PySide6>=6.8,<7",
  "markdown>=3.7",
]

[project.urls]
homepage = "https://github.com/fubai/auto-pm"
source = "https://github.com/fubai/auto-pm"
changelog = "https://github.com/fubai/auto-pm/blob/main/CHANGELOG.md"
documentation = "https://github.com/fubai/auto-pm"
issues = "https://github.com/fubai/auto-pm/issues"

[project.scripts]
auto-pm = "auto_pm.cli.__main__:cli"

[dependency-groups]
dev = [
    "copier>=9.7.1,<10",
    "commitizen>=3,<4",
    "faker>=30,<31",
    "mypy>=1,<2",
    "polyfactory>=2,<3",
    "pre-commit>=3,<4",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "pytest-datadir>=1,<2",
    "pytest-env>=1,<2",
    "pytest-qt>=4.4,<5",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<0.6",
    "toml-sort>=0.24.2,<0.25",
    "safety>=3.2.9,<4",
    "types-PyYAML>=6,<7",
]

[tool.uv]
required-version = ">=0.8.4"

[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
extend-exclude = ["02_设计", "scratch_*.py"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "T20"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]
"tests/**/*.py" = ["T201"]
"**/auto_pm/__init__.py" = ["E402"]
"**/bridges/*.py" = ["N802", "N815", "T201"]
"**/modbus/modbus_bridge.py" = ["N802", "N815", "T201"]
"**/modbus/modbus_service.py" = ["N802"]
"**/infrastructure/logging/logging.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.commitizen]  # https://commitizen-tools.github.io/commitizen/config/
bump_message = "bump(release): v$current_version → v$new_version"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "pep621"

[tool.mypy]  # https://mypy.readthedocs.io/en/latest/config_file.html
exclude = []
strict = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
check_untyped_defs = true
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]  # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
pythonpath = [
  ".", "auto_pm",
]
testpaths = [
    "tests",
]
markers = [
    "gui: GUI 全功能自动化测试",
    "cli: CLI 命令测试",
    "smoke: 冒烟测试（核心功能快速验证）",
    "unit: 单元测试",
    "integration: 集成测试",
    "slow: 慢速测试（运行时间 > 5s）",
]
addopts = [
    "--cov=auto_pm",
    "--cov-report=term",
    "--cov-report=html:coverage/html",
    "--cov-report=xml:coverage/coverage.xml",
    "--junitxml=coverage/junit/test-results.xml",
    "--color=yes"
]

[tool.pytest_env]
ENVIRONMENT = "test"

[tool.coverage.run]
source = ["auto_pm"]
omit = [
    "tests/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.tomlsort]
all = false
in_place = true
no_comments = false
no_header_comments = false
no_footer_comments = false
no_inline_comments = false
no_block_comments = false
no_sort_tables = true
sort_table_keys = false
sort_inline_tables = false
sort_inline_arrays = false
trailing_comma_inline_array = false
ignore_case = true

[tool.tomlsort.overrides."dependencies"]
table_keys = true

[tool.tomlsort.overrides."dev"]
table_keys = true

[tool.tomlsort.overrides."typing"]
table_keys = true
