<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>驾驶舱 · 项目总览</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F4F1}
a{color:#1F5FBF}a:hover{color:#174A96}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: #F3F4F1; color: #1C2024; font-family: 'Noto Sans SC', system-ui, sans-serif; font-size: 14px; box-sizing: border-box; padding: 28px 32px 48px">
  <div style="max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 30px; height: 30px; border-radius: 8px; background: #1C2024; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 12l4-3"></path></svg>
          </div>
          <h1 style="margin: 0; font-size: 24px; font-weight: 700">全部项目</h1>
        </div>
        <div style="font-size: 13px; color: #5B636B">先看哪里等你，再点进项目处理。</div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{filters}}" as="fl" hint-placeholder-count="4">
          <button onClick="{{fl.pick}}" aria-pressed="{{fl.pressed}}" style="{{fl.style}}">{{fl.label}}</button>
        </sc-for>
        <button style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #C9CDC5; background: #FFFFFF; font-size: 14px; color: #1C2024; cursor: pointer">新建项目</button>
      </div>
    </header>

    <section aria-label="汇总" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
      <div style="background: #FFF4DC; border: 1px solid #F0D9A6; border-radius: 12px; padding: 14px 16px"><div style="font-size: 13px; color: #3D444B">需要你决定</div><div style="font-size: 30px; font-weight: 700">5</div><div style="font-size: 12px; color: #5B636B">分布在 2 个项目</div></div>
      <div style="background: #FFFFFF; border: 1px solid #DCDFD8; border-radius: 12px; padding: 14px 16px"><div style="font-size: 13px; color: #3D444B">正在进行</div><div style="font-size: 30px; font-weight: 700">1</div><div style="font-size: 12px; color: #5B636B">每个项目同时最多一张</div></div>
      <div style="background: #E6F4EC; border: 1px solid #BFDFCB; border-radius: 12px; padding: 14px 16px"><div style="font-size: 13px; color: #3D444B">本周完成</div><div style="font-size: 30px; font-weight: 700">4</div><div style="font-size: 12px; color: #5B636B">已同步台账</div></div>
      <div style="background: #FDECEA; border: 1px solid #F0C4BF; border-radius: 12px; padding: 14px 16px"><div style="font-size: 13px; color: #3D444B">出问题的</div><div style="font-size: 30px; font-weight: 700">2</div><div style="font-size: 12px; color: #5B636B">都在 auto-pm</div></div>
    </section>

    <section aria-label="项目列表" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px">
      <sc-for list="{{shown}}" as="p" hint-placeholder-count="4">
        <a href="单个项目.dc.html" style="text-decoration: none; color: #1C2024; background: #FFFFFF; border: 1px solid #DCDFD8; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B636B">{{p.id}} · {{p.type}}</span>
              <span style="font-size: 17px; font-weight: 700">{{p.name}}</span>
            </div>
            <span style="{{p.stateStyle}}">{{p.state}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B636B">等你</span><span style="{{p.waitStyle}}">{{p.wait}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B636B">出问题</span><span style="{{p.issueStyle}}">{{p.issues}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B636B">开着</span><span style="font-size: 20px; font-weight: 700">{{p.open}}</span></div>
          </div>
          <div style="border-top: 1px solid #EEF0EC; padding-top: 12px; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; color: #5B636B">在干</span>
            <span style="font-size: 14px">{{p.now}}</span>
          </div>
          <div style="font-size: 12px; color: #5B636B">最近动态：{{p.last}}</div>
        </a>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const f = this.state.filter;
    const tone = { '执行中': ['#EAF0FA', '#174A96'], '规划中': ['#FFF4DC', '#7A4F00'], '挂起': ['#EEF0EC', '#3D444B'], '归档': ['#E6F4EC', '#1E5E38'] };
    const data = [
      { id: 'SW-2026-008', type: '软件', name: 'auto-pm 自动化项目管理工具', state: '执行中', wait: 4, issues: 2, open: '4 / 8', now: '历史任务读不出来时看板不挂 · Claude', last: '[时间] 提交检查点' },
      { id: 'SYS-2026-001', type: '治理', name: '工作空间治理', state: '规划中', wait: 1, issues: 0, open: '1 / 8', now: '没有在干的卡', last: '[时间] PM 起草了角色包底座范围' },
      { id: 'DJ-2026-000', type: 'PLC', name: '[PLC 项目]', state: '挂起', wait: 0, issues: 0, open: '0 / 8', now: '没有在干的卡', last: '[时间] 挂起' },
      { id: '[项目编号]', type: 'PLC', name: '[已交付项目]', state: '归档', wait: 0, issues: 0, open: '0 / 8', now: '已交付', last: '[日期] 归档' }
    ];
    const keep = (p) => f === 'all' || (f === 'wait' && p.wait > 0) || (f === 'issue' && p.issues > 0) || (f === 'active' && p.state !== '归档');
    const shown = data.filter(keep).map((p) => ({
      ...p,
      stateStyle: 'flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;background:' + tone[p.state][0] + ';color:' + tone[p.state][1],
      waitStyle: 'font-size:20px;font-weight:700;color:' + (p.wait > 0 ? '#7A4F00' : '#5B636B'),
      issueStyle: 'font-size:20px;font-weight:700;color:' + (p.issues > 0 ? '#B42318' : '#5B636B')
    }));
    const filterData = [
      { id: 'all', label: '全部' }, { id: 'wait', label: '有事等你' }, { id: 'issue', label: '出问题的' }, { id: 'active', label: '未归档' }
    ];
    const filters = filterData.map((x) => ({
      ...x,
      pressed: f === x.id ? 'true' : 'false',
      pick: () => this.setState({ filter: x.id }),
      style: 'height:40px;padding:0 14px;border-radius:8px;font-size:14px;cursor:pointer;' + (f === x.id ? 'border:none;background:#1C2024;color:#FFFFFF' : 'border:1px solid #C9CDC5;background:#FFFFFF;color:#1C2024')
    }));
    return { shown, filters };
  }
}
</script>
</body>
</html>
