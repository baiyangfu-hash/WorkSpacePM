version: "3"

# [A2-4 归档标注 2026-09-06]
# 此文件对应 2026-08-28 冻结前的研发母体口径（SW-2026-008 母体本地开发用）。
# 当前生产环境请参照 00_Infrastructure/auto_pm（稳定部署容器），
# CLI 入口已切流至 release 1.2.3-f950525，本 Taskfile 仅供母体开发回退参考。

vars:
  ALL: . tests/
  SOURCES: ./

tasks:
  lint-fix:
    desc: "Fix linting issues"
    cmds:
      - python -m ruff check --fix {{.SOURCES}}
      - python -m ruff format {{.SOURCES}}

  ruff:
    desc: "Run ruff"
    cmds:
      - python -m ruff check {{.SOURCES}}
      - python -m ruff format --check {{.SOURCES}}

  coverage:
    desc: "Open the latest coverage report in a web browser"
    cmds:
      - cmd: start coverage/html/index.html
        platforms: [windows]
      - cmd: open coverage/html/index.html
        platforms: [darwin, linux]

  lint:
    desc: "Run all linting tasks"
    deps:
      - ruff
      - mypy

  mypy:
    desc: "Run MyPy for static type checking"
    cmds:
      - python -m mypy --ignore-missing-imports {{.SOURCES}}

  qa:
    desc: "Run linting and tests"
    deps:
      - test
      - lint

  test:
    desc: "Run tests with coverage"
    cmds:
      - python -m pytest -vv {{.CLI_ARGS}}

  test-fast:
    desc: "Run tests without coverage (fast)"
    cmds:
      - python -m pytest -vv --no-cov {{.CLI_ARGS}}

  test-gui:
    desc: "Run QML GUI tests only"
    cmds:
      - python -m pytest -vv tests/qml/ {{.CLI_ARGS}}

  test-unit:
    desc: "Run unit tests only (exclude GUI)"
    cmds:
      - python -m pytest -vv tests/change/ tests/cli/ tests/core/ tests/db/ tests/models/ tests/plc/ tests/utils/ tests/logging/ tests/config/ {{.CLI_ARGS}}

  smoke:
    desc: "Run smoke tests (CLI --help)"
    cmds:
      - python -m auto_pm --help
      - python -m auto_pm project --help
      - python -m auto_pm change --help
      - python -m auto_pm plc --help
      - python -m auto_pm template --help

  gate:
    desc: "Run pre-closure gate (ruff + mypy + pytest) and output JSON evidence"
    cmds:
      - python scripts/pre_closure_gate.py --workspace .

  ruff-baseline:
    desc: "Check if ruff extended rules errors exceeded baseline"
    cmds:
      - python scripts/ruff_baseline_check.py --baseline reports/ruff_extended_baseline.json --threshold 0.05
