<title>驾驶舱总控屏 v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: desktop shell (dark rail + light work area + bottom console drawer), the same bones the PySide6 app will have.
   Color: graphite rail, cool neutral surfaces, one ink-blue accent; red/amber/blue/green only for severity, grey dashed = not checked.
   Type: Microsoft YaHei UI in the real app (Noto Sans SC here), Consolas in the real app (JetBrains Mono here) for ids, hashes and commands. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface2:#f5f7f9; --line:#dfe3e9; --line2:#c8cfd9;
  --ink:#15191f; --ink2:#485262; --ink3:#616b7a;
  --rail:#171c24; --rail-ink:#a9b2bf; --rail-on:#ffffff; --rail-line:#262d38; --rail-hover:#212833; --rail-act:#2a3342;
  --accent:#1d5c8f; --accent-ink:#ffffff; --accent-soft:#e1edf7;
  --block:#c6262e; --block-soft:#fbe9ea; --risk:#9a5c08; --risk-soft:#fdf1dc; --hint:#2f6db3; --hint-soft:#e6eef9;
  --ok:#2c7a46; --ok-soft:#e3f2e8; --na:#5f687a; --na-soft:#eef0f4;
  --sans:"Microsoft YaHei UI","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,Menlo,monospace;
  --shadow:0 1px 2px rgba(15,25,40,.06),0 8px 24px rgba(15,25,40,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1217; --surface:#171b22; --surface2:#1c212a; --line:#272d37; --line2:#374050;
  --ink:#e7eaef; --ink2:#a0aab9; --ink3:#8f99a8;
  --rail:#0a0d11; --rail-ink:#8e98a7; --rail-line:#1a1f27; --rail-hover:#141922; --rail-act:#1e2633;
  --accent:#5aa3de; --accent-ink:#071420; --accent-soft:#172636;
  --block:#ff7078; --block-soft:#381d20; --risk:#e8aa52; --risk-soft:#332810; --hint:#7eb0f2; --hint-soft:#182640;
  --ok:#62c686; --ok-soft:#15301f; --na:#8994a5; --na-soft:#212630; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#171b22; --surface2:#1c212a; --line:#272d37; --line2:#374050;
  --ink:#e7eaef; --ink2:#a0aab9; --ink3:#8f99a8;
  --rail:#0a0d11; --rail-ink:#8e98a7; --rail-line:#1a1f27; --rail-hover:#141922; --rail-act:#1e2633;
  --accent:#5aa3de; --accent-ink:#071420; --accent-soft:#172636;
  --block:#ff7078; --block-soft:#381d20; --risk:#e8aa52; --risk-soft:#332810; --hint:#7eb0f2; --hint-soft:#182640;
  --ok:#62c686; --ok-soft:#15301f; --na:#8994a5; --na-soft:#212630; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);height:100%;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 14px;color:var(--rail-on);font-weight:700;font-size:15px;letter-spacing:.04em}
.brand svg{width:22px;height:22px;stroke:var(--rail-on)}
.grp{font-size:11px;letter-spacing:.14em;color:#8590a0;padding:14px 10px 6px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:none;border:0;text-align:left;color:var(--rail-ink);width:100%}
.nav:hover{background:var(--rail-hover);color:var(--rail-on)}
.nav[aria-current="page"]{background:var(--rail-act);color:var(--rail-on)}
.nav .badge{margin-left:auto;min-width:20px;padding:0 6px;height:18px;border-radius:9px;font-size:11px;line-height:18px;text-align:center;background:var(--block);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.nav .badge.soft{background:#394353;color:#d5dbe4}
.rail .spacer{flex:1}
.rail .foot{padding:10px;font-size:11px;color:#8590a0;border-top:1px solid var(--rail-line);margin-top:8px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);font-size:12px;white-space:nowrap}
.chip b{font-weight:500;color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.off .dot{background:var(--na)}
.chip.warn .dot{background:var(--risk)}
.top .grow{flex:1}
a.btn{text-decoration:none}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 12px;color:var(--ink2);font-size:12px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.demo{display:inline-flex;align-items:center;height:22px;padding:0 8px;border:1px dashed var(--na);color:var(--na);border-radius:4px;font-size:11px;letter-spacing:.04em}
.scroll{flex:1;min-height:0;overflow:auto;padding:22px 24px 28px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h2{font-size:14px;margin:0;font-weight:700}
.sub{color:var(--ink2);font-size:12.5px}
.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hd .sub{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px 18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>.hd{padding:0 2px}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--na-soft);color:var(--na)}
.pill.block{background:var(--block-soft);color:var(--block)}
.pill.risk{background:var(--risk-soft);color:var(--risk)}
.pill.hint{background:var(--hint-soft);color:var(--hint)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.na{background:transparent;border:1px dashed var(--na);color:var(--na)}
.pill svg.i{width:12px;height:12px;stroke-width:2.2}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* today: headline */
.lead{display:flex;align-items:center;gap:22px;padding:18px 22px;flex-wrap:wrap}
.lead .big{font-size:44px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lead .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:240px}
.lead .t b{font-size:16px}
.mix{display:flex;gap:8px;flex-wrap:wrap}

/* queue */
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 18px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .l{display:flex;flex-direction:column;gap:4px;min-width:0}
.q .row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .ttl{font-size:14.5px;font-weight:700}
.q .why{color:var(--ink2);font-size:12.5px}
.q .r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.q .age{font-size:12px;color:var(--ink2);white-space:nowrap}
.q .age b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.q .say{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-radius:6px;padding:6px 8px;color:var(--ink2);font-size:12px}
.q .say .mono{color:var(--ink);overflow-wrap:anywhere}
.q .say .btn{margin-left:auto}
.q .acts{display:flex;gap:6px}
.more{padding:10px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:12.5px}

/* integrity */
.int{display:flex;flex-direction:column}
.ir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 16px;border-top:1px solid var(--line)}
.ir:first-child{border-top:0}
.ir .k{font-weight:500}
.ir .h{grid-column:1/-1;font-size:11.5px;color:var(--ink3)}
.ir .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.ir .v.na{font-weight:500;font-size:12.5px;color:var(--na);border:1px dashed var(--na);border-radius:4px;padding:0 8px;line-height:22px}
.ir .v.bad{color:var(--block)} .ir .v.warn{color:var(--risk)} .ir .v.good{color:var(--ok)}
.gauge{display:flex;gap:3px;padding:12px 16px 0}
.gauge i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.gauge i.on{background:var(--accent)}
.gauge i.off{background:transparent;border:1px dashed var(--na)}

/* work + timeline */
.work{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.wk{padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.wk:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.dots{display:flex;gap:3px}
.dots i{flex:1;height:6px;border-radius:2px;background:var(--line2)}
.dots i.d{background:var(--accent)}
.dots i.c{background:var(--accent);outline:2px solid var(--accent-soft);outline-offset:1px}
.dots i.u{background:var(--risk)}
.dots i.f{background:var(--block)}
.tl{display:grid;grid-template-columns:104px 150px minmax(0,1fr);gap:0}
.tl>div{padding:9px 14px;border-top:1px solid var(--line);align-items:center;display:flex}
.tl>div:nth-child(-n+3){border-top:0}
.tl .t{color:var(--ink3)}

/* missions board */
.mis{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col>h3{margin:0;font-size:12.5px;display:flex;align-items:center;gap:8px;color:var(--ink2);padding:2px 4px}
.col>h3 b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.mc:hover{border-color:var(--line2)}
.mc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mc .id{color:var(--ink3)}
.mc .tt{font-weight:500;line-height:1.4}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.empty{border:1px dashed var(--line2);border-radius:7px;padding:14px;color:var(--ink3);font-size:12px;text-align:center}
.det{position:sticky;top:0;display:flex;flex-direction:column}
.det .hdr{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.spine{list-style:none;margin:0;padding:12px 18px 6px;display:flex;flex-direction:column}
.sp{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;position:relative;padding-bottom:12px}
.sp:not(:last-child)::before{content:"";position:absolute;left:12px;top:24px;bottom:-2px;width:2px;background:var(--line2)}
.sp.done:not(:last-child)::before{background:var(--accent)}
.sp .nd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:var(--surface);color:var(--ink3);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.sp.done .nd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sp.cur .nd{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sp.user .nd{border-color:var(--risk);color:var(--risk);box-shadow:0 0 0 4px var(--risk-soft)}
.sp.lost .nd{border-color:var(--block);color:var(--block);box-shadow:0 0 0 4px var(--block-soft)}
.sp.park .nd{border-style:dashed;border-color:var(--na);color:var(--na)}
.sp .nd svg.i{width:12px;height:12px;stroke-width:2.6}
.sp .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.sp .nm{display:flex;gap:8px;align-items:center;font-weight:500}
.sp.todo .nm{color:var(--ink3);font-weight:400}
.sp .ev{font-size:11.5px;color:var(--ink3);overflow-wrap:anywhere}
.sp .ev.none{color:var(--na)}
.who{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:17px;font-weight:400}
.next{margin:4px 14px 16px;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface2);border:1px solid var(--line)}
.next.user{background:var(--risk-soft);border-color:transparent}
.next.lost{background:var(--block-soft);border-color:transparent}
.next b{font-size:13.5px}
.cmd{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.cmd .mono{flex:1;overflow-wrap:anywhere;min-width:0}
.steps-fix{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:11.5px;font-weight:500;color:var(--ink3);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
.gates{display:flex;gap:4px;flex-wrap:wrap}
.g{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font-size:11px;background:var(--na-soft);color:var(--na);white-space:nowrap}
.g.ok{background:var(--ok-soft);color:var(--ok)} .g.bad{background:var(--block-soft);color:var(--block)} .g.wait{background:var(--risk-soft);color:var(--risk)}
.g.na{background:transparent;border:1px dashed var(--na)}
.g svg.i{width:11px;height:11px;stroke-width:2.6}
.verdict{display:flex;flex-direction:column;gap:5px}
.reason{font-size:12px;color:var(--ink2)}

/* worktrees */
.topo{display:flex;flex-direction:column;align-items:center;gap:0;padding:18px 18px 6px}
.root-box{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 16px;display:flex;flex-direction:column;gap:2px;align-items:center;max-width:100%}
.stem{width:2px;height:16px;background:var(--line2)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.fld input,.fld select{height:30px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--ink);padding:0 8px;font:inherit}

/* release */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.ps{padding:14px 14px 14px 18px;display:flex;flex-direction:column;gap:4px;position:relative;background:var(--surface2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-left:-8px}
.ps:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);margin-left:0;border-left:1px solid var(--line)}
.ps.done{background:var(--ok-soft)} .ps.cur{background:var(--accent-soft)} .ps.user{background:var(--risk-soft)}
.ps .n{font-size:11px;color:var(--ink3)} .ps b{font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;margin:0}
.kv dt{color:var(--ink3)} .kv dd{margin:0;overflow-wrap:anywhere}
.oral{display:flex;flex-direction:column}
.oral>div{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.oral>div:first-child{border-top:0}

/* plc */
.verd{display:flex;gap:16px;align-items:center;padding:18px 20px;flex-wrap:wrap}
.verd .badge-lg{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex:none}
.verd .badge-lg svg.i{width:26px;height:26px;stroke-width:2.2}
.verd.ok .badge-lg{background:var(--ok-soft);color:var(--ok)}
.verd.bad .badge-lg{background:var(--block-soft);color:var(--block)}
.verd.na .badge-lg{border:1.5px dashed var(--na);color:var(--na)}
.verd .t{flex:1;min-width:240px;display:flex;flex-direction:column;gap:2px}
.verd .t b{font-size:17px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-top:1px solid var(--line);align-items:start}
.li:first-child{border-top:0}
.li .s{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--na-soft);color:var(--na)}
.li .s.ok{background:var(--ok-soft);color:var(--ok)} .li .s.bad{background:var(--block-soft);color:var(--block)} .li .s.warn{background:var(--risk-soft);color:var(--risk)}
.li .s svg.i{width:12px;height:12px;stroke-width:2.6}
.note{font-size:12px;color:var(--ink3)}

/* spine svg */
.svgbox{overflow-x:auto;padding:6px 8px 12px}
.svgbox svg{display:block;min-width:960px;width:100%;height:auto}
.lg{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 14px;color:var(--ink2);font-size:12px}

/* commands */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input{height:30px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;min-width:220px}
.fchip{height:26px;padding:0 11px;border-radius:13px;border:1px solid var(--line2);background:var(--surface);font-size:12px;color:var(--ink2)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* console drawer + sheet + toast */
.drawer{border-top:1px solid var(--line);background:var(--surface)}
.drawer>button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 24px;text-align:left;color:var(--ink2);font-size:12px}
.drawer .log{max-height:180px;overflow:auto;border-top:1px solid var(--line);padding:6px 24px 10px;display:flex;flex-direction:column;gap:6px}
.log .e{display:grid;grid-template-columns:96px minmax(0,1fr) 70px;gap:12px;align-items:baseline}
.log .e .mono{overflow-wrap:anywhere}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,20,.5);display:grid;place-items:center;padding:20px;z-index:50}
.sheet{width:min(560px,100%);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.sheet h2{font-size:17px}
.sheet .danger{background:var(--risk-soft);color:var(--risk);border-radius:6px;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:60;box-shadow:var(--shadow)}

@media (max-width:1100px){.mis{grid-template-columns:minmax(0,1fr)}.det{position:static}.cols{grid-template-columns:minmax(0,1fr)}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;padding:6px 8px;overflow-x:auto;overflow-y:hidden;gap:4px;align-items:center}
  .brand,.grp,.rail .foot,.rail .spacer{display:none}
  .nav{width:auto;white-space:nowrap}
  .top{padding:8px 16px}
  .scroll{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  .board{grid-template-columns:minmax(0,1fr)}
  .pipe{grid-template-columns:minmax(0,1fr);gap:6px}
  .ps,.ps:first-child{clip-path:none;margin-left:0;border:1px solid var(--line);border-radius:6px}
  .tl{grid-template-columns:minmax(0,1fr)}
  .tl>div{border-top:0;padding:2px 14px}
  .drawer>button{padding-inline:16px}.drawer .log{padding-inline:16px}
  .log .e{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.mc,.btn,.nav,.wk{transition:background-color .12s,border-color .12s,box-shadow .12s}}

.hc{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hc .ht{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hc .ht b{font-size:15px}
.hc dl{display:grid;grid-template-columns:104px 1fr;gap:6px 14px;margin:0;font-size:13px}
.hc dt{color:var(--ink2)}
.hc dd{margin:0}
.hc .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.chip.act{font:inherit;cursor:pointer;background:var(--block-soft);color:var(--block);border-color:transparent}
.chip.bad{background:var(--block-soft);color:var(--block);border-color:transparent}
.wz .steps{display:flex;gap:6px;flex-wrap:wrap}
.wz .facts{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px;margin:0}
.wz .facts dt{color:var(--ink2)}
.wz .facts dd{margin:0}
.wz input[type=text],.wz input[type=password]{height:36px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;width:100%}
.wz .warn{background:var(--risk-soft);color:var(--risk);border-radius:6px;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.wz .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
@media (max-width:640px){.hc dl,.wz .facts{grid-template-columns:1fr}}

function nowT(){var d=new Date(Date.now()-7*3600e3),z=function(n){return ('0'+n).slice(-2)};return z(d.getUTCHours())+':'+z(d.getUTCMinutes())+':'+z(d.getUTCSeconds())}
function addLog(cmd,rc){S.log.unshift({t:nowT(),cmd:cmd,rc:rc,ex:1})}
function copy(t){

 try{navigator.clipboard.writeText(t).then(done,function(){fallback(t,done)})}catch(e){fallback(t,done)}
}
function fallback(t,done){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('请手动选中复制')}a.remove()}

 else if(a==='sheetx')closeSheet();
 else if(a==='sheetgo'){
  var o=getHow(t.dataset.how,t.dataset.id),id=t.dataset.id;addLog(o.cmd.replace('python ','').replace(/USER_EVIDENCE/,'user-confirmation:gui-click-…'),0);

 }
