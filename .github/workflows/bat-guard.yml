# 批处理守护：每个 PR 都跑（可设成必过检查），只读、几秒钟，不执行任何 .bat。
# 防止 .bat/.cmd 再出现括号块里读 %errorlevel%（TD-SW008-150）和块里 echo 带没转义右括号（TD-SW008-181）。
# 测试：tests/test_bat_scripts.py
name: bat-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bat-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: utf-8

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest==9.1.1  # 与 requirements-lock-py312-win.txt 一致

      - name: No errorlevel or unescaped echo paren inside a block
        run: python -m pytest -q -p no:cacheprovider -o addopts= tests/test_bat_scripts.py
