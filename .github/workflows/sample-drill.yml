# 样件联调（发版前门槛）：用假任务从入箱一路跑到收口与台账对账，喂各种料型和故意违规动作。
# 只在临时目录里跑，不碰任何真实工作区或账本。已知缺陷以 strict xfail 登记，意外变绿也判不通过。
name: sample-drill

on:
  push:
    paths:
      - "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具/auto_pm/**"
      - "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具/tests/e2e/**"
      - "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具/scripts/sample_drill.py"
      - "00_Infrastructure/auto_pm/launcher/**"
      - ".github/workflows/sample-drill.yml"
  pull_request:
    branches: [main]
    paths:
      - "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具/auto_pm/**"
      - "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具/tests/e2e/**"
      - "00_Infrastructure/auto_pm/launcher/**"
      - ".github/workflows/sample-drill.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-drill-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROJ: "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具"
  QT_QPA_PLATFORM: offscreen
  PYTHONDONTWRITEBYTECODE: "1"
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The PLC sample is materialised from a pinned commit, so the history must be present.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for Qt (offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the locked dependencies
        run: |
          python -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          python -m pip check

      - name: Sample drill
        working-directory: ${{ env.PROJ }}
        run: python scripts/sample_drill.py

      - name: The working tree must still be clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --short; exit 1; fi
