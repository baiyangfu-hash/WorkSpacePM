# 仓库根 tests/ 全量：启动器、发布入口、批处理守护、PLC 模板对齐等。
# 这些测试此前只有 bat-guard、gitignore-guard 各跑自己一个文件，其余（启动器字节码残留、发布入口、tests/plc/*）没有任何 CI 在跑。
# 同一作业再跑 SW-2026-010（驾驶舱 A6 验证套件）自己的 tests/：它也没有任何 CI 在跑。
# 只增加覆盖，不改任何已有检查的判定。每个 PR 和 main 推送都跑（不设 paths 过滤），几秒钟。
name: root-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: utf-8

jobs:
  root-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 版本与 requirements-lock-py312-win.txt 一致；tests/plc 的模板对齐测试要导入驾驶舱的 domain 层（pydantic、PyYAML）。
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 pydantic==2.13.4 pydantic-settings==2.15.0 PyYAML==6.0.3 click==8.4.2 rich==15.0.0

      - name: Repo-root tests
        run: python -m pytest -q -p no:cacheprovider -o addopts= tests

      - name: SW-2026-010 project tests
        working-directory: 01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-010_驾驶舱A6Python验证套件
        run: python -m pytest -q -p no:cacheprovider -o addopts= tests

      # SW-2026-009（驾驶舱的测试样件）的 tests/ 此前没有 CI；含 QML 联调测试，需要 PySide6，用离屏平台跑。
      - name: SW-2026-009 project dependencies
        run: |
          # Qt 的离屏平台也要系统自带的 EGL/GL 等库，runner 镜像没有 libEGL。
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install PySide6-Essentials==6.12.0 requests==2.34.2 cefrpy==1.0.3

      - name: SW-2026-009 project tests
        working-directory: 01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-009_英语学习助手
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider -o addopts= tests
