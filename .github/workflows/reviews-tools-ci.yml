# 判卷脚本测试（TD-SW008-228）：reviews/tools 下的审计、越界检查、安全区检查等脚本自带测试，以前没有任何检查在跑它们。
# 每个 PR 都完整运行（好设成必过检查）：这些测试还会读 .github/ 下的 PR 模板与 pr-gate、safety-gate 工作流、0100_PLC自动化 下的 PLC 源码，
# 改那些文件的 PR 不碰 reviews/tools，按“没碰就不适用”判断会假绿（审计 366），所以不做范围判断。
# 包括 test_plc_ci.py（33 个测试约 16 秒；plc-ci 只在改 PLC 或检查代码时才跑，改 plc_ci.py 的 PR 以前合并前没人检验，审计 366 P3）。它是提前报警，不替代审计，结果也不是任何卡的验收证据。
# 另有一步“文本编码检查”（审计 368）：PR 改动的文本文件必须是严格 UTF-8、无乱码；push 到 main 和手动运行查全仓。只用标准库，不依赖下面装的包。
# 说明：项目文件夹 plans/技术债方案_TD228_判卷脚本测试接进CI_20261028.md。
name: reviews-tools-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "reviews/tools/**"
      - ".github/workflows/reviews-tools-ci.yml"
      - "00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt"
  workflow_dispatch:

# 只读令牌；没有任何步骤用到密钥。
permissions:
  contents: read

concurrency:
  group: reviews-tools-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: utf-8
  # The tests create commits in throw-away repositories.
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  reviews-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 审计 368：错误编码的文件会让 GitHub 把整页显示成乱码，而 errors=replace 会把坏字节悄悄抹掉。已知的历史遗留登记在 reviews/tools/encoding_allowlist.txt（按文件内容登记）。
      - name: Text encoding check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python reviews/tools/encoding_check.py --base "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" --head "$HEAD_SHA"
          else
            python reviews/tools/encoding_check.py --all --head HEAD
          fi

      - name: Install the locked dependencies
        run: |
          python -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          python -m pip check

      # test_plc_ci.py is included.  -o addopts= drops the cockpit's coverage options; reviews/tools has no pytest config of its own.
      - name: Judge-script tests
        run: |
          python -m pytest -q -p no:cacheprovider -p no:pytest-qt -o addopts= \
            reviews/tools
