# 提交钩子复跑（盘点 P1-2，方案 plans/P1-2_钩子进CI复跑方案_20261029.md）：本机 commit-msg 钩子要求“含生产代码的提交必须绑定变更单”，
# `git commit --no-verify` 或没装钩子的电脑（云端、Trae）能绕过；这里在服务器上对 PR 的每个提交按同一套函数复跑。
#
# 报警期：只在作业摘要和标注里报，作业恒绿（脚本默认退出码 0），不挡任何 PR，也不是必过检查；先观察两周统计误报。
# 转必过（脚本加 --enforce、用户在 GitHub 把 hook-replay 加进 main 必过检查）要用户点头。
#
# 裁判全部来自 PR 基线（main），PR 改不了它，写法同 pr-gate.yml：
# - pull_request_target：GitHub 用 main 上的这份工作流，而不是 PR 里改过的版本；
# - 脚本和它导入的 auto_pm 都取自基线检出；
# - PR 头只拉成 git 对象，脚本用 git show 当数据读，其中的任何文件都不导入、不执行、不安装。
# PR 描述（用户 2026-11-01 裁决：云端 PR 的提交说明常常不写单号，认描述里的变更单号或“任务卡: 路径”一行）只经环境变量 PR_BODY
# 传给脚本，不进命令行、不插进 shell；脚本把它当数据读。
# 不设 paths 过滤：以后要设必过检查，就必须对每个 PR 都报告结果。
name: hook-replay

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]  # edited：改 PR 描述（补单号或任务卡）后要重新复跑

# 只读令牌；没有任何步骤用到密钥。
permissions:
  contents: read

concurrency:
  group: hook-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the PR base (the judge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the locked dependencies of the base
        run: |
          python -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          python -m pip check

      # Data only: the PR head becomes git objects; no work tree is made and nothing in it runs.
      - name: Fetch the PR head as data
        env:
          TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          test "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA"

      - name: Replay the commit-msg hook
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GIT_CONFIG_COUNT: "3"
          GIT_CONFIG_KEY_0: filter.lfs.smudge
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: filter.lfs.process
          GIT_CONFIG_VALUE_1: ""
          GIT_CONFIG_KEY_2: filter.lfs.required
          GIT_CONFIG_VALUE_2: "false"
        run: >-
          python -I "$GITHUB_WORKSPACE/reviews/tools/hook_replay.py" --ci
          --base "$(git rev-parse HEAD)" --head "$HEAD_SHA" --repo "$GITHUB_WORKSPACE"
