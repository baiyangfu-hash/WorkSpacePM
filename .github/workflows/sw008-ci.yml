# SW-2026-008 minimal CI (Linux checks, plus the cli/core groups, the sample drill and the long gate drill on Windows).  Runs the checks that already exist.
# It is an early warning.  It does NOT replace the governed local gates and its result is not
# acceptance evidence for any card.  A PASS_KNOWN_BASELINE result is not an all-green result.
name: sw008-ci

on:
  push:
    paths:
      - "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具/**"
      - "00_Infrastructure/auto_pm/environment/**"
      - ".github/workflows/sw008-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具/**"
      - "00_Infrastructure/auto_pm/environment/**"
      - ".github/workflows/sw008-ci.yml"
  workflow_dispatch:

# Read-only token; no secrets are used by any step.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now obsolete check - except on main: every commit on main
# must get a verdict (M3-MAIN requires a commit on which this check passed).
concurrency:
  group: sw008-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROJ: "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具"
  QT_QPA_PLATFORM: offscreen
  PYTHONDONTWRITEBYTECODE: "1"
  # The e2e tests create commits in throw-away repositories.
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for Qt (offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the locked dependencies
        run: |
          python -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          python -m pip check

      # Minimal start in the clean environment (TD-SW008-114): the cockpit's own health check must pass on the locked set.
      # main.py doctor exits 0 even when a check fails, so the step reads all_passed itself and fails on False.
      - name: Minimal start (doctor must report all_passed)
        working-directory: ${{ env.PROJ }}
        run: |
          python main.py doctor
          python -c 'import sys; from auto_pm.ui.cli.doctor import run_doctor_check; r = run_doctor_check(); print("doctor all_passed =", r["all_passed"]); sys.exit(0 if r["all_passed"] else 1)'

      - name: CI tools self-test (the checks must be able to fail)
        run: python -I "$PROJ/tests/tools/sw008_ci/selftest.py"

      - name: Secret scan (lines added by this change)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Ordinary branches (push, manual run): the whole range origin/main..HEAD, as before, so the commits of a push
          # that a newer push cancelled are scanned by the next one. A push to main (never cancelled): before..HEAD.
          # A pull request: base.sha..HEAD.
          base=origin/main
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            base="$BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::error::secret scan base '$base' is not available in this checkout; scan refused (fail closed)"
            exit 1
          fi
          python -I "$PROJ/tests/tools/sw008_ci/secret_scan.py" "$base"

      - name: Ruff
        working-directory: ${{ env.PROJ }}
        run: python -m ruff check --no-cache auto_pm tests

      - name: Mypy (win32 platform, as the product runs on Windows)
        working-directory: ${{ env.PROJ }}
        run: python -m mypy --platform win32 --no-incremental --cache-dir=/dev/null auto_pm

      - name: Pytest
        id: pytest
        working-directory: ${{ env.PROJ }}
        run: |
          set +e
          python -m pytest -q -p no:cacheprovider -o addopts= -n 4 tests 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compare the failures with the known Linux baseline
        run: python -I "$PROJ/tests/tools/sw008_ci/compare_baseline.py" "$RUNNER_TEMP/pytest.log" "$PROJ/tests/tools/sw008_ci/baseline.linux.json" "${{ steps.pytest.outputs.code }}"

      - name: The working tree must still be clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --short; exit 1; fi

      - name: Keep the test log for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw008-pytest-log
          path: ${{ runner.temp }}/pytest.log
          retention-days: 14

  # The product runs on Windows; the Linux job cannot see Windows-only faults (CRLF from write_text, share-deny
  # file handles, a fake agent that is a /bin/sh script). This job runs the cli and core groups and the sample
  # drill on a real Windows runner. Same rule as above: early warning, not acceptance evidence.
  windows-cli-core:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths (the project paths are deep and Chinese)
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          # full history: the sample drill builds its benchmark from a pinned commit
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A clean virtual environment, as the installer makes on a field PC: the runner's own Python carries pipx,
      # whose pins clash with the lock file and fail pip check.
      - name: Install the locked dependencies into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: Minimal start (doctor must report all_passed)
        working-directory: ${{ env.PROJ }}
        env:
          PYTHONUTF8: "1"
        run: |
          "$RUNNER_TEMP/venv/Scripts/python.exe" main.py doctor
          "$RUNNER_TEMP/venv/Scripts/python.exe" -c 'import sys; from auto_pm.ui.cli.doctor import run_doctor_check; r = run_doctor_check(); print("doctor all_passed =", r["all_passed"]); sys.exit(0 if r["all_passed"] else 1)'

      - name: Pytest (core, sample drill)
        working-directory: ${{ env.PROJ }}
        run: >-
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pytest -q -p no:cacheprovider -o addopts= -n 4
          tests/core tests/e2e/test_closure_drill.py tests/e2e/test_closure_drill_agent_misconduct.py
          tests/e2e/test_long_gate.py

      # The long gate must survive the session that started it (10-23: a session teardown killed card 184's gate twice).
      # This launches the runner through a real scheduled task, kills the launching process tree, kills the runner
      # mid-group and resumes it. Fake groups and a fake renewal only; no ledger.
      - name: Long gate drill (kill the session mid-gate, then resume)
        working-directory: ${{ env.PROJ }}
        run: '"$RUNNER_TEMP/venv/Scripts/python.exe" -B scripts/long_gate_drill.py'

      - name: The working tree must still be clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --short; exit 1; fi

  # cli has its own job (windows-cli): cli+core together took 42 of the 45 minutes.
  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths (the project paths are deep and Chinese)
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          # full history: the sample drill builds its benchmark from a pinned commit
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A clean virtual environment, as the installer makes on a field PC: the runner's own Python carries pipx,
      # whose pins clash with the lock file and fail pip check.
      - name: Install the locked dependencies into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: Pytest (cli)
        working-directory: ${{ env.PROJ }}
        run: >-
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pytest -q -p no:cacheprovider -o addopts= -n 4 tests/cli

      - name: The working tree must still be clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --short; exit 1; fi

  # More Windows coverage, in parallel with the first Windows job (which alone needs 30-45 minutes): the groups it does
  # not cover (qml, the other e2e files, every other directory) run on their own runners with their own timeouts.
  # Early warning only: continue-on-error keeps a failure here from blocking a merge until its known failures are sorted
  # out (WBS question pool); the failures are listed in the step log (-rf, --tb=line).
  windows-extra:
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: qml
            targets: tests/qml
          - group: e2e-1
            targets: tests/e2e/test_approval_pin_drill.py tests/e2e/test_ide_lane_drill.py tests/e2e/test_pmf_chg_tracking_check.py tests/e2e/test_pmf_gate_failures.py tests/e2e/test_pmf_gate_judge.py
          - group: e2e-2
            targets: tests/e2e/test_pmf_handoff.py tests/e2e/test_pmf_intake.py tests/e2e/test_pmf_plc.py tests/e2e/test_pmf_python.py
          - group: e2e-3
            targets: tests/e2e/test_pmf_reclaim.py tests/e2e/test_pmf_recovery.py tests/e2e/test_pmf_template_plc.py tests/e2e/test_pmf_template_python.py
          - group: e2e-4
            targets: tests/e2e/test_pmf_tier_classifier.py tests/e2e/test_raw_requirement_drill.py tests/e2e/test_release_pycache_drill.py tests/e2e/test_trial_run_drill.py tests/e2e/test_pmf_gui.py
          - group: rest
            targets: --ignore=tests/e2e --ignore=tests/qml --ignore=tests/cli --ignore=tests/core tests
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths (the project paths are deep and Chinese)
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the locked dependencies into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      # faulthandler_timeout prints the stack of a test that hangs for 4 minutes, so a hang names its test.
      - name: Pytest (${{ matrix.group }})
        timeout-minutes: 30
        working-directory: ${{ env.PROJ }}
        run: >-
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pytest -q -rf --tb=line --durations=10 -p no:cacheprovider -o addopts=
          -o faulthandler_timeout=240 -n 4 ${{ matrix.targets }}

      - name: The working tree must still be clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --short; exit 1; fi
