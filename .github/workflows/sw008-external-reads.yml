# 读项目目录以外真文件的驾驶舱测试（pytest -m external_reads，清单 tests/tools/sw008_ci/external_reads_manifest.txt），每个 PR 都跑。
# 为什么：sw008-ci 按路径过滤，只在改驾驶舱项目目录时才跑；这些测试读的是 AGENTS.md、CLAUDE.md、roles/、.trae/、规范库、
# reviews/tools、PLC 样例等项目外的文件，只改这些文件的 PR 从来不跑它们（#551 漏过 D-199，#831 合后 main 红了两条角色检查）。
# 不设 paths 过滤，所以不用维护一张“测试会读哪些外部文件”的路径表：新加的外部读取由 test_external_reads_marked 逼着打标记，
# 打了标记就自动进本检查。ci-aggregate 按“没有 paths 就每个 PR 都该跑”把它算成必过。Linux 一组，约 5 分钟；Windows 的全量仍在 sw008-ci。
name: sw008-external-reads

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw008-external-reads-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROJ: "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具"
  QT_QPA_PLATFORM: offscreen
  PYTHONDONTWRITEBYTECODE: "1"
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  external-reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for Qt (offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the locked dependencies
        run: |
          python -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          python -m pip check

      - name: Tests that read files outside the project
        working-directory: ${{ env.PROJ }}
        run: python -m pytest -q -p no:cacheprovider -o addopts= -n 4 -m external_reads tests

      - name: The working tree must still be clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then git status --short; exit 1; fi
