# 忽略规则守护：每个 PR 都跑（可设成必过检查），只读、几秒钟。
# 防止 .gitignore 的 *.db 等规则把 PLC 数据块源文件（GlobalVars.db 等）挡掉，新建项目 git add 静默漏入库（审计 91）。
# 同时确认运行时库（.auto-pm/index.db 等）仍被忽略。测试：tests/test_gitignore_plc_db.py
name: gitignore-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitignore-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: utf-8

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest==9.1.1  # 与 requirements-lock-py312-win.txt 一致

      - name: PLC .db must not be ignored, runtime .db must be
        run: python -m pytest -q -p no:cacheprovider -o addopts= tests/test_gitignore_plc_db.py
