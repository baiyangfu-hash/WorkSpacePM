name: gate-full

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJ: "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  group:
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group:
          - application
          - change
          - cli
          - contracts
          - core
          - infrastructure
          - plc
          - core_basis_serial
          - qml
          - qml_debounce_alone
          - rest
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: Official gate group ${{ matrix.group }}
        working-directory: ${{ env.PROJ }}
        run: |
          JOBS=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c 'import os; print(max(1, min(4, os.cpu_count() or 1)))')
          "$RUNNER_TEMP/venv/Scripts/python.exe" tests/tools/sw008_ci/gate_run_ci.py run \
            --group "${{ matrix.group }}" --out "$RUNNER_TEMP/gate-out/${{ matrix.group }}" --jobs "$JOBS" --timeout-minutes 90

      - name: Upload the group record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.group }}
          path: ${{ runner.temp }}/gate-out/${{ matrix.group }}
          if-no-files-found: warn

  # CHG-SCPT-2026-626: the Siemens language service plugin, really run (V09~V11 and friends).
  # The plugin is downloaded at run time from the official VS Code Marketplace at a pinned version, its command line is checked against a
  # pinned SHA256 before use, and it lives only in $RUNNER_TEMP of this one job: never committed, never cached, never uploaded, gone with
  # the runner.  Only this job sets AUTO_PM_SIEMENS_LSP; the eleven groups above keep the "no plugin" default of tests/conftest.py.
  plugin:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LSP_PUBLISHER: dynamicengineering
      LSP_EXTENSION: dynamic-siemens-language-support
      LSP_VERSION: "2.17.2"
      LSP_EXE_SHA256: "690f0c692350956416d6b2768f48a1daa119dd6c5b55c6b25bb6fa19f4951985"  # the user's installed 2.17.2, read on the laptop 11-10
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: Download the plugin from the Marketplace and check its hash
        run: |
          set -euo pipefail
          base="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/$LSP_PUBLISHER/vsextensions/$LSP_EXTENSION/$LSP_VERSION/vspackage"
          dest="$RUNNER_TEMP/siemens-lsp"
          mkdir -p "$dest"
          # one universal package (its .vsixmanifest has no TargetPlatform), so no targetPlatform query
          curl -fsSL --compressed --retry 3 -o "$dest/plugin.vsix" "$base"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$dest/plugin.vsix" "$dest/unpacked"
          exe="$dest/unpacked/extension/out/go/windows-amd64/siemens-lsp.exe"
          test -f "$exe" || { echo "siemens-lsp.exe not found in the package"; exit 1; }
          # hashlib: Git-Bash's own hash tool prefixes the digest with a backslash when the path has backslashes
          actual=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$exe" | tr -d '\r')
          echo "siemens-lsp.exe sha256: $actual"
          if [ "$actual" != "$LSP_EXE_SHA256" ]; then
            echo "::error::siemens-lsp.exe hash $actual is not the pinned $LSP_EXE_SHA256; the plugin is not used"
            exit 1
          fi
          echo "AUTO_PM_SIEMENS_LSP=$(cygpath -w "$exe")" >> "$GITHUB_ENV"

      - name: Plugin tests (a skip counts as a failure)
        working-directory: ${{ env.PROJ }}
        env:
          AUTO_PM_REQUIRE_SIEMENS_LSP: "1"
        run: |
          go version || echo "no Go toolchain on PATH"  # the plugin's test runner builds Go; record which one the runner had
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pytest -q -vv -p no:cacheprovider --no-cov -rs \
            tests/e2e/test_pmf_template_plc.py -k "plugin"

  verdict:
    needs: group
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: ${{ runner.temp }}/parts

      - name: Merge and judge
        working-directory: ${{ env.PROJ }}
        run: |
          python tests/tools/sw008_ci/gate_run_ci.py merge \
            --in "$RUNNER_TEMP"/parts/gate-* --out "$RUNNER_TEMP/gate-final" --worktree "$GITHUB_WORKSPACE"

      - name: Upload the verdict and the failure list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-verdict
          path: ${{ runner.temp }}/gate-final
