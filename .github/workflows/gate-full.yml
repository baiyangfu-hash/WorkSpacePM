name: gate-full

on:
  workflow_dispatch:
  # CHG-SCPT-2026-705: every merge into main runs the full gate on that commit by itself; nobody has to press "Run".
  push:
    branches: [main]

# CHG-SCPT-2026-705: one run per branch at a time, and only the newest commit counts.  Two merges in a row: the run for the
# older one is cancelled and the newer one runs.  A cancelled run leaves no verdict and no commit status (the verdict and
# commit-status jobs below skip on cancel), so an older commit never shows a half-run result.
concurrency:
  group: gate-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJ: "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  group:
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group:
          - application
          - change
          - cli
          - contracts
          - core
          - infrastructure
          - plc
          - core_basis_serial
          - qml
          - qml_debounce_alone
          - rest
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: Official gate group ${{ matrix.group }}
        working-directory: ${{ env.PROJ }}
        run: |
          JOBS=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c 'import os; print(max(1, min(4, os.cpu_count() or 1)))')
          "$RUNNER_TEMP/venv/Scripts/python.exe" tests/tools/sw008_ci/gate_run_ci.py run \
            --group "${{ matrix.group }}" --out "$RUNNER_TEMP/gate-out/${{ matrix.group }}" --jobs "$JOBS" --timeout-minutes 90

      - name: Upload the group record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.group }}
          path: ${{ runner.temp }}/gate-out/${{ matrix.group }}
          if-no-files-found: warn

  # CHG-SCPT-2026-626: the Siemens language service plugin, really run (V09~V11 and friends).
  # The plugin is downloaded at run time from the official VS Code Marketplace at a pinned version, its command line is checked against a
  # pinned SHA256 before use, and it lives only in $RUNNER_TEMP of this one job: never committed, never cached, never uploaded, gone with
  # the runner.  Only this job sets AUTO_PM_SIEMENS_LSP; the eleven groups above keep the "no plugin" default of tests/conftest.py.
  plugin:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LSP_PUBLISHER: dynamicengineering
      LSP_EXTENSION: dynamic-siemens-language-support
      LSP_VERSION: "2.17.2"
      LSP_EXE_SHA256: "690f0c692350956416d6b2768f48a1daa119dd6c5b55c6b25bb6fa19f4951985"  # the user's installed 2.17.2, read on the laptop 11-10
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: Download the plugin from the Marketplace and check its hash
        run: |
          set -euo pipefail
          base="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/$LSP_PUBLISHER/vsextensions/$LSP_EXTENSION/$LSP_VERSION/vspackage"
          dest="$RUNNER_TEMP/siemens-lsp"
          mkdir -p "$dest"
          # one universal package (its .vsixmanifest has no TargetPlatform), so no targetPlatform query
          curl -fsSL --compressed --retry 3 -o "$dest/plugin.vsix" "$base"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$dest/plugin.vsix" "$dest/unpacked"
          exe="$dest/unpacked/extension/out/go/windows-amd64/siemens-lsp.exe"
          test -f "$exe" || { echo "siemens-lsp.exe not found in the package"; exit 1; }
          # hashlib: Git-Bash's own hash tool prefixes the digest with a backslash when the path has backslashes
          actual=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$exe" | tr -d '\r')
          echo "siemens-lsp.exe sha256: $actual"
          if [ "$actual" != "$LSP_EXE_SHA256" ]; then
            echo "::error::siemens-lsp.exe hash $actual is not the pinned $LSP_EXE_SHA256; the plugin is not used"
            exit 1
          fi
          echo "AUTO_PM_SIEMENS_LSP=$(cygpath -w "$exe")" >> "$GITHUB_ENV"

      - name: Plugin tests (a skip counts as a failure)
        working-directory: ${{ env.PROJ }}
        env:
          AUTO_PM_REQUIRE_SIEMENS_LSP: "1"
        run: |
          go version || echo "no Go toolchain on PATH"  # the plugin's test runner builds Go; record which one the runner had
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pytest -q -vv -p no:cacheprovider --no-cov -rs \
            --basetemp "$RUNNER_TEMP/plugin-tests" tests/e2e/test_pmf_template_plc.py -k "plugin"

      - name: Plugin test raw output when it failed (diagnosis only, nothing is kept)
        if: failure()
        run: |
          # the cockpit keeps only the first panic line; print the plugin's whole output for the V09 project
          for dir in "$RUNNER_TEMP"/plugin-tests/test_v09_*/*/02_PLC程序/PLC_ST; do
            [ -d "$dir" ] || continue
            echo "== $dir"
            (cd "$dir" && "$(cygpath -u "$AUTO_PM_SIEMENS_LSP")" test . 2>&1 | tail -n 200) || true
          done

  verdict:
    needs: group
    # CHG-SCPT-2026-705: a red group still gets judged (FAIL with the reasons), but a run cancelled because a newer commit
    # arrived does not: always() would also run on cancel and publish a "groups incomplete" verdict for the older commit.
    if: ${{ !cancelled() }}
    # D-223: the judge imports the cockpit package (the same judging code the groups ran), so it needs the same locked
    # dependencies as the groups.  The lock file is the Windows one, hence the same runner image and the same install step.
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.record.outputs.verdict }}
      digest: ${{ steps.record.outputs.digest }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Name the verdict after the commit
        id: name
        run: echo "artifact=gate-verdict-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: ${{ runner.temp }}/parts

      - name: Merge and judge
        working-directory: ${{ env.PROJ }}
        run: |
          # gate-* also matches a verdict an earlier attempt of this run uploaded (re-run): it is not a group record
          rm -rf "$RUNNER_TEMP"/parts/gate-verdict*
          "$RUNNER_TEMP/venv/Scripts/python.exe" tests/tools/sw008_ci/gate_run_ci.py merge \
            --in "$RUNNER_TEMP"/parts/gate-* --out "$RUNNER_TEMP/gate-final" --worktree "$GITHUB_WORKSPACE"

      # CHG-SCPT-2026-705: the commit number and the verdict file's SHA-256 always go into the job summary and the job's
      # outputs (the commit-status job reads them), also when the merge step above failed or left no verdict file.
      - name: Record the commit and the verdict hash
        id: record
        if: ${{ !cancelled() }}
        env:
          ARTIFACT: ${{ steps.name.outputs.artifact }}
        run: |
          summary="$RUNNER_TEMP/gate-final/gate_summary.json"
          if [ -f "$summary" ]; then
            verdict=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('verdict') or 'MISSING')" "$summary" | tr -d '\r')
            digest=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$summary" | tr -d '\r')
          else
            verdict=MISSING
            digest=none
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## gate-full 判决记录"
            echo "- 提交号: $GITHUB_SHA"
            echo "- 判决: $verdict"
            echo "- gate_summary.json SHA-256: $digest"
            echo "- 判决产物: $ARTIFACT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verdict and the failure list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/gate-final
          overwrite: true

  # CHG-SCPT-2026-705: leave the conclusion on the commit itself (commit status, context "gate-full"), so a merge shows PASS or
  # FAIL next to it without anyone opening the run.  PASS needs both halves of this workflow: the merged verdict of the eleven
  # groups is PASS and the plugin job succeeded.  Only this job may write statuses; it checks nothing out and runs no repo code.
  commit-status:
    needs: [verdict, plugin]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the gate-full status on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ needs.verdict.outputs.verdict }}
          DIGEST: ${{ needs.verdict.outputs.digest }}
          PLUGIN: ${{ needs.plugin.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$VERDICT" = "PASS" ] && [ "$PLUGIN" = "success" ]; then
            state=success
            word=PASS
          else
            state=failure
            word=FAIL
          fi
          description="$word: verdict ${VERDICT:-MISSING} sha256 ${DIGEST:0:12}, plugin $PLUGIN"
          echo "$GITHUB_SHA -> $state ($description)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=gate-full -f description="$description" -f target_url="$RUN_URL"
