name: gate-full

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJ: "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  group:
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: DEBUG quick run of the tests this branch touched
        working-directory: ${{ env.PROJ }}
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pytest -p no:cacheprovider --no-cov -q -rfE \
            tests/core/test_gate_run_service.py tests/cli/test_gate_cli.py tests/tools/test_gate_progress.py \
            tests/core/test_release_deploy_check.py tests/infrastructure/test_process_probe.py 2>&1 | tail -n 150

      - name: Official gate group ${{ matrix.group }}
        working-directory: ${{ env.PROJ }}
        run: |
          JOBS=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c 'import os; print(max(1, min(4, os.cpu_count() or 1)))')
          "$RUNNER_TEMP/venv/Scripts/python.exe" tests/tools/sw008_ci/gate_run_ci.py run \
            --group "${{ matrix.group }}" --out "$RUNNER_TEMP/gate-out/${{ matrix.group }}" --jobs "$JOBS" --timeout-minutes 90

      - name: DEBUG print the group record
        if: always()
        run: |
          cd "$RUNNER_TEMP/gate-out/core" || exit 0
          ls -la
          for f in *; do
            echo "=== $f"
            if [ "${f##*.}" = "json" ]; then head -c 6000 "$f"; echo; else grep -aE "^(FAILED|ERROR) |\[gate run\]" "$f" | head -n 80; echo "--- tail"; tail -n 120 "$f"; fi
          done

      - name: Upload the group record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.group }}
          path: ${{ runner.temp }}/gate-out/${{ matrix.group }}
          if-no-files-found: warn
