name: gate-full
run-name: ${{ inputs.task_id && format('gate-full {0} {1}', inputs.task_id, inputs.candidate_sha) || format('gate-full {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        type: string
        description: 驾驶舱任务号
      candidate_sha:
        type: string
        description: 候选完整提交号
      base_sha:
        type: string
        description: 当前 main 完整提交号
      requested_tier:
        type: string
        default: L3
        description: 请求门禁档次（L2|L3，服务端按基线与改动路径重算并可强升 L3）
  push:
    branches: [main]

concurrency:
  group: gate-full-${{ inputs.task_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJ: "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:

  identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      candidate: ${{ steps.check.outputs.candidate }}
      reuse: ${{ steps.check.outputs.reuse }}
      digest: ${{ steps.check.outputs.digest }}
      tier: ${{ steps.check.outputs.tier }}
      groups: ${{ steps.check.outputs.groups }}
      groups_csv: ${{ steps.check.outputs.groups_csv }}
      run_plugin: ${{ steps.check.outputs.run_plugin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm candidate and check for reusable evidence
        id: check
        env:
          TASK_ID: ${{ inputs.task_id }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          REQUESTED_BASE: ${{ inputs.base_sha }}
          REQUESTED_TIER: ${{ inputs.requested_tier }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "${TASK_ID}${REQUESTED_SHA}${REQUESTED_BASE}" ]]; then
            [[ "$TASK_ID" =~ ^[0-9a-f]{32}$ && "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$GITHUB_REF" == refs/heads/main && "$REQUESTED_BASE" == "$GITHUB_SHA" ]]
            git cat-file -e "$REQUESTED_SHA^{commit}"
            git merge-base --is-ancestor "$REQUESTED_BASE" "$REQUESTED_SHA"
            candidate="$REQUESTED_SHA"
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

          reuse() {
            [[ "$GITHUB_EVENT_NAME" == push ]] || return 1
            local base prior tree prior_tree status run id digest artifact
            read -r merge base prior extra < <(git rev-list --parents -n 1 "$GITHUB_SHA")
            [[ -n "$base" && -n "$prior" && -z "$extra" ]] || return 1
            git diff --quiet "$base" "$GITHUB_SHA" -- .github/workflows/gate-full.yml || return 1
            tree=$(git rev-parse "$GITHUB_SHA^{tree}") || return 1
            prior_tree=$(git rev-parse "$prior^{tree}") || return 1
            [[ "$tree" == "$prior_tree" ]] || return 1
            status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$prior/statuses" --paginate --slurp |
              jq -c '[.[][] | select(.context == "gate-full" and .creator.login == "github-actions[bot]")][0]') || return 1
            jq -e 'type == "object" and .state == "success"' <<< "$status" >/dev/null || return 1
            run=$(jq -r '.target_url' <<< "$status")
            id=${run##*/}
            [[ "$run" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" && "$id" =~ ^[0-9]+$ ]] || return 1
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" |
              jq -e --arg base "$base" --arg prior "$prior" '
                .event == "workflow_dispatch" and .path == ".github/workflows/gate-full.yml"
                and .head_branch == "main" and .head_sha == $base and .conclusion == "success"
                and (.display_title | test("^gate-full [0-9a-f]{32} " + $prior + "$"))' >/dev/null || return 1
            artifact="$RUNNER_TEMP/reuse-verdict"
            gh run download --repo "$GITHUB_REPOSITORY" "$id" --name "gate-verdict-${prior::12}" --dir "$artifact" || return 1
            jq -e --arg prior "$prior" '
              .commit == $prior and .verdict == "PASS" and .complete == true and
              .tier == "L3" and .plugin_result == "success" and
              (.manifest_sha256 | test("^[0-9a-f]{64}$"))' "$artifact/gate_summary.json" >/dev/null || return 1
            digest=$(sha256sum "$artifact/gate_summary.json" | cut -d' ' -f1) || return 1
            jq -e --arg desc "PASS: verdict PASS sha256 ${digest}, plugin success" \
              '.description == $desc' <<< "$status" >/dev/null || return 1
            mv "$artifact/gate_summary.json" "$artifact/candidate_gate_summary.json" || return 1
            jq --arg merge "$GITHUB_SHA" --arg prior "$prior" --arg base "$base" \
              --arg tree "$tree" --arg run "$run" --arg digest "$digest" '
                .commit = $merge | .commit_end = $merge |
                .reused_from = {commit: $prior, first_parent: $base, tree: $tree, run_url: $run, sha256: $digest}
              ' "$artifact/candidate_gate_summary.json" > "$artifact/gate_summary.json" || return 1
            digest=$(sha256sum "$artifact/gate_summary.json" | cut -d' ' -f1) || return 1
            echo "artifact=gate-verdict-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "reuse=$run" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "复用同树候选 $prior 的 GitHub 门禁 $run（第一父提交 $base）" >> "$GITHUB_STEP_SUMMARY"
          }
          if reuse; then
            echo "tier=L3" >> "$GITHUB_OUTPUT"
            echo "groups=[\"core\"]" >> "$GITHUB_OUTPUT"
            echo "groups_csv=" >> "$GITHUB_OUTPUT"
            echo "run_plugin=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "${TASK_ID}${REQUESTED_SHA}${REQUESTED_BASE}" ]]; then
            python3 "$PROJ/tests/tools/sw008_ci/gate_plan_ci.py" \
              --repo "$GITHUB_WORKSPACE" \
              --base "$REQUESTED_BASE" \
              --candidate "$candidate" \
              --requested-tier "${REQUESTED_TIER:-L3}" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 "$PROJ/tests/tools/sw008_ci/gate_plan_ci.py" \
              --repo "$GITHUB_WORKSPACE" \
              --base "$candidate" \
              --candidate "$candidate" \
              --requested-tier "L3" \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Upload evidence for the same-tree merge
        if: steps.check.outputs.reuse != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.check.outputs.artifact }}
          path: ${{ runner.temp }}/reuse-verdict
          if-no-files-found: error
          overwrite: true

  group:
    needs: identity
    if: ${{ !needs.identity.outputs.reuse }}
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.identity.outputs.groups) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked out commit
        env:
          CANDIDATE: ${{ needs.identity.outputs.candidate }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: Official gate group ${{ matrix.group }}
        working-directory: ${{ env.PROJ }}
        run: |
          JOBS=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c 'import os; print(max(1, min(4, os.cpu_count() or 1)))')
          "$RUNNER_TEMP/venv/Scripts/python.exe" tests/tools/sw008_ci/gate_run_ci.py run \
            --group "${{ matrix.group }}" --out "$RUNNER_TEMP/gate-out/${{ matrix.group }}" --jobs "$JOBS" --timeout-minutes 90

      - name: Upload the group record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.group }}
          path: ${{ runner.temp }}/gate-out/${{ matrix.group }}
          if-no-files-found: warn

  # CHG-SCPT-2026-626: the Siemens language service plugin, really run (V09~V11 and friends).
  # The plugin is downloaded at run time from the official VS Code Marketplace at a pinned version, its command line is checked against a
  # pinned SHA256 before use, and it lives only in $RUNNER_TEMP of this one job: never committed, never cached, never uploaded, gone with
  # the runner.  Only this job sets AUTO_PM_SIEMENS_LSP; the eleven groups above keep the "no plugin" default of tests/conftest.py.
  plugin:
    needs: identity
    if: ${{ !needs.identity.outputs.reuse && needs.identity.outputs.run_plugin == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LSP_PUBLISHER: dynamicengineering
      LSP_EXTENSION: dynamic-siemens-language-support
      LSP_VERSION: "2.17.2"
      LSP_EXE_SHA256: "690f0c692350956416d6b2768f48a1daa119dd6c5b55c6b25bb6fa19f4951985"  # the user's installed 2.17.2, read on the laptop 11-10
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked out commit
        env:
          CANDIDATE: ${{ needs.identity.outputs.candidate }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: Download the plugin from the Marketplace and check its hash
        run: |
          set -euo pipefail
          base="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/$LSP_PUBLISHER/vsextensions/$LSP_EXTENSION/$LSP_VERSION/vspackage"
          dest="$RUNNER_TEMP/siemens-lsp"
          mkdir -p "$dest"
          # one universal package (its .vsixmanifest has no TargetPlatform), so no targetPlatform query
          curl -fsSL --compressed --retry 3 -o "$dest/plugin.vsix" "$base"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$dest/plugin.vsix" "$dest/unpacked"
          exe="$dest/unpacked/extension/out/go/windows-amd64/siemens-lsp.exe"
          test -f "$exe" || { echo "siemens-lsp.exe not found in the package"; exit 1; }
          # hashlib: Git-Bash's own hash tool prefixes the digest with a backslash when the path has backslashes
          actual=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$exe" | tr -d '\r')
          echo "siemens-lsp.exe sha256: $actual"
          if [ "$actual" != "$LSP_EXE_SHA256" ]; then
            echo "::error::siemens-lsp.exe hash $actual is not the pinned $LSP_EXE_SHA256; the plugin is not used"
            exit 1
          fi
          echo "AUTO_PM_SIEMENS_LSP=$(cygpath -w "$exe")" >> "$GITHUB_ENV"

      - name: Plugin tests (a skip counts as a failure)
        working-directory: ${{ env.PROJ }}
        env:
          AUTO_PM_REQUIRE_SIEMENS_LSP: "1"
        run: |
          go version || echo "no Go toolchain on PATH"  # the plugin's test runner builds Go; record which one the runner had
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pytest -q -vv -p no:cacheprovider --no-cov -rs \
            --basetemp "$RUNNER_TEMP/plugin-tests" tests/e2e/test_pmf_template_plc.py -k "plugin"

      - name: Plugin test raw output when it failed (diagnosis only, nothing is kept)
        if: failure()
        run: |
          # the cockpit keeps only the first panic line; print the plugin's whole output for the V09 project
          for dir in "$RUNNER_TEMP"/plugin-tests/test_v09_*/*/02_PLC程序/PLC_ST; do
            [ -d "$dir" ] || continue
            echo "== $dir"
            (cd "$dir" && "$(cygpath -u "$AUTO_PM_SIEMENS_LSP")" test . 2>&1 | tail -n 200) || true
          done

  verdict:
    needs: [identity, group, plugin]
    if: ${{ !cancelled() && needs.identity.result == 'success' && !needs.identity.outputs.reuse }}
    # D-223: the judge imports the cockpit package (the same judging code the groups ran), so it needs the same locked
    # dependencies as the groups.  The lock file is the Windows one, hence the same runner image and the same install step.
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.record.outputs.verdict }}
      digest: ${{ steps.record.outputs.digest }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Name the verdict after the commit
        id: name
        env:
          CANDIDATE: ${{ needs.identity.outputs.candidate }}
          TIER: ${{ needs.identity.outputs.tier }}
        run: |
          if [ "$TIER" = "L2" ]; then
            echo "artifact=gate-verdict-l2-${CANDIDATE::12}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=gate-verdict-${CANDIDATE::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked out commit
        env:
          CANDIDATE: ${{ needs.identity.outputs.candidate }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: ${{ runner.temp }}/parts

      - name: Merge and judge
        working-directory: ${{ env.PROJ }}
        env:
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          TIER: ${{ needs.identity.outputs.tier }}
          EXPECTED_GROUPS: ${{ needs.identity.outputs.groups_csv }}
        run: |
          # gate-* also matches a verdict an earlier attempt of this run uploaded (re-run): it is not a group record
          rm -rf "$RUNNER_TEMP"/parts/gate-verdict*
          "$RUNNER_TEMP/venv/Scripts/python.exe" tests/tools/sw008_ci/gate_run_ci.py merge \
            --in "$RUNNER_TEMP"/parts/gate-* --out "$RUNNER_TEMP/gate-final" --worktree "$GITHUB_WORKSPACE" \
            --plugin-result "$PLUGIN_RESULT" --tier "$TIER" --expected-groups "$EXPECTED_GROUPS"

      # CHG-SCPT-2026-705: the commit number and the verdict file's SHA-256 always go into the job summary and the job's
      # outputs (the commit-status job reads them), also when the merge step above failed or left no verdict file.
      - name: Record the commit and the verdict hash
        id: record
        if: ${{ !cancelled() }}
        env:
          ARTIFACT: ${{ steps.name.outputs.artifact }}
          CANDIDATE: ${{ needs.identity.outputs.candidate }}
          TIER: ${{ needs.identity.outputs.tier }}
        run: |
          summary="$RUNNER_TEMP/gate-final/gate_summary.json"
          if [ -f "$summary" ]; then
            verdict=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8')).get('verdict') or 'MISSING')" "$summary" | tr -d '\r')
            digest=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "$summary" | tr -d '\r')
          else
            verdict=MISSING
            digest=none
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## gate-full 判决记录"
            echo "- 门禁档次: ${TIER:-L3}"
            echo "- 提交号: $CANDIDATE"
            echo "- 判决: $verdict"
            echo "- gate_summary.json SHA-256: $digest"
            echo "- 判决产物: $ARTIFACT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verdict and the failure list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/gate-final
          overwrite: true

  # CHG-SCPT-2026-705: leave the conclusion on the commit itself (commit status, context "gate-full"), so a merge shows PASS or
  # FAIL next to it without anyone opening the run.  PASS needs both halves of this workflow: the merged verdict of the eleven
  # groups is PASS and the plugin job succeeded.  Only this job may write statuses; it checks nothing out and runs no repo code.
  commit-status:
    needs: [identity, verdict, plugin]
    if: ${{ !cancelled() && needs.identity.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the gate-full status on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ needs.verdict.outputs.verdict }}
          DIGEST: ${{ needs.verdict.outputs.digest }}
          PLUGIN: ${{ needs.plugin.result }}
          CANDIDATE: ${{ needs.identity.outputs.candidate }}
          REUSED: ${{ needs.identity.outputs.reuse }}
          REUSED_DIGEST: ${{ needs.identity.outputs.digest }}
          TIER: ${{ needs.identity.outputs.tier }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$REUSED" ]; then
            context=gate-full
            state=success
            description="PASS: reused exact candidate tree, sha256 ${REUSED_DIGEST:0:12}"
          elif [ "$TIER" = "L2" ]; then
            context=gate-l2
            if [ "$VERDICT" = "PASS" ] && { [ "$PLUGIN" = "skipped" ] || [ "$PLUGIN" = "success" ]; }; then
              state=success
              word=PASS
            else
              state=failure
              word=FAIL
            fi
            description="$word: verdict ${VERDICT:-MISSING} tier L2 sha256 ${DIGEST}, plugin $PLUGIN"
          else
            context=gate-full
            if [ "$VERDICT" = "PASS" ] && [ "$PLUGIN" = "success" ]; then
              state=success
              word=PASS
            else
              state=failure
              word=FAIL
            fi
            description="$word: verdict ${VERDICT:-MISSING} sha256 ${DIGEST}, plugin $PLUGIN"
          fi
          echo "$CANDIDATE [$context] -> $state ($description)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE" \
            -f state="$state" -f context="$context" -f description="$description" -f target_url="$RUN_URL"
