name: gate-full

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJ: "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  group:
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip check

      - name: Official gate group ${{ matrix.group }}
        working-directory: ${{ env.PROJ }}
        run: |
          JOBS=$("$RUNNER_TEMP/venv/Scripts/python.exe" -c 'import os; print(max(1, min(4, os.cpu_count() or 1)))')
          "$RUNNER_TEMP/venv/Scripts/python.exe" tests/tools/sw008_ci/gate_run_ci.py run \
            --group "${{ matrix.group }}" --out "$RUNNER_TEMP/gate-out/${{ matrix.group }}" --jobs "$JOBS" --timeout-minutes 90

      - name: "Debug only: print the failed cases into the job log"
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gate-out/${{ matrix.group }}/${{ matrix.group }}.txt"
          ls -la "$RUNNER_TEMP/gate-out/${{ matrix.group }}" || true
          echo "=== FAILED / ERROR lines ==="
          grep -E "^(FAILED|ERROR) " "$LOG" || echo "(none matched)"
          echo "=== last 200 lines ==="
          tail -n 200 "$LOG" || true

      - name: Upload the group record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.group }}
          path: ${{ runner.temp }}/gate-out/${{ matrix.group }}
          if-no-files-found: warn
