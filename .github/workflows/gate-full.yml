name: gate-full

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJ: "01_Project自动化项目管理/Python自动化项目总库/02_在研项目/SW-2026-008_auto-pm_自动化项目管理工具"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -m pip install -q --no-deps -r 00_Infrastructure/auto_pm/environment/requirements-lock-py312-win.txt
      - name: Probe variants inside the gate's white-listed child environment
        working-directory: ${{ env.PROJ }}
        run: |
          cat > "$RUNNER_TEMP/probe_env.py" <<'PY'
          import os, subprocess, sys, time
          sys.path.insert(0, os.getcwd())
          from auto_pm.application.core.gate_run_service import child_environment
          CIM = "Get-CimInstance Win32_Process | ForEach-Object { '{0}|{1}|{2}' -f $_.ProcessId, $_.ParentProcessId, $_.CommandLine }"
          IMPORT = "Import-Module CimCmdlets; " + CIM
          SEARCHER = "foreach ($p in ([wmisearcher]'SELECT ProcessId,ParentProcessId,CommandLine FROM Win32_Process').Get()) { '{0}|{1}|{2}' -f $p['ProcessId'], $p['ParentProcessId'], $p['CommandLine'] }"
          TRIVIAL = "'hello'"
          def probe(label, script, env):
              command = ["powershell", "-NoProfile", "-NonInteractive", "-Command", script]
              start = time.monotonic()
              try:
                  done = subprocess.run(command, capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=300, check=False, env=env)
                  rows = [r for r in done.stdout.splitlines() if r.strip()]
                  mine = sum(1 for r in rows if r.split("|")[0] == str(os.getpid()))
                  print(f"PROBE {label}: rc={done.returncode} seconds={time.monotonic() - start:.1f} stdout_lines={len(rows)} own_pid_rows={mine} stderr={done.stderr.strip()[:1500]!r}", flush=True)
              except Exception as error:
                  print(f"PROBE {label}: EXCEPTION after {time.monotonic() - start:.1f}s: {error!r}", flush=True)
          full = dict(os.environ)
          white = child_environment()
          for round_ in (1, 2):
              probe(f"r{round_} full cim", CIM, full)
              probe(f"r{round_} white trivial", TRIVIAL, white)
              probe(f"r{round_} white cim", CIM, white)
              probe(f"r{round_} white import-module", IMPORT, white)
              probe(f"r{round_} white wmisearcher", SEARCHER, white)
              for name in ("PSMODULEANALYSISCACHEPATH", "POWERSHELL_DISTRIBUTION_CHANNEL", "POWERSHELL_UPDATECHECK", "DRIVERDATA", "LOGONSERVER", "PROCESSOR_IDENTIFIER", "USERDOMAIN_ROAMINGPROFILE"):
                  got = next((v for k, v in full.items() if k.upper() == name), None)
                  if got is not None:
                      probe(f"r{round_} white+{name} cim", CIM, {**white, name: got})
          forced = {k: v for k, v in white.items() if k not in full or full[k] != v}
          print("FORCED_OR_CHANGED", sorted(forced), flush=True)
          for name in sorted(forced):
              env = dict(white); env.pop(name)
              if name in full: env[name] = full[name]
              probe(f"white-minus-forced-{name} cim", CIM, env)
          PY
          "$RUNNER_TEMP/venv/Scripts/python.exe" "$RUNNER_TEMP/probe_env.py"
      - name: Durations of the tests that start PowerShell, inside the white-listed environment
        working-directory: ${{ env.PROJ }}
        run: |
          cat > "$RUNNER_TEMP/run_white.py" <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, os.getcwd())
          from auto_pm.application.core.gate_run_service import child_environment
          argv = [sys.executable, "-B", "-m", "pytest", "-p", "no:cacheprovider", "--no-cov", "-q", "--durations=25", "-rs",
                  "tests/infrastructure/test_powershell_script_rules.py", "tests/infrastructure/test_memory_gate_in_cockpit.py",
                  "tests/core/test_release_deploy_check.py", "tests/core/test_release_deploy.py", "tests/core/test_release_ops.py", "tests/e2e/test_long_gate.py"]
          print("EXIT", subprocess.run(argv, env=child_environment(), check=False).returncode)
          PY
          "$RUNNER_TEMP/venv/Scripts/python.exe" "$RUNNER_TEMP/run_white.py" || true
